name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test deps
        run: python -m pip install --upgrade pip && pip install pytest

      - name: Syntax check (py_compile 全量 src/eval/tests/deploy)
        run: python -m compileall -q src eval tests deploy

      - name: Unit tests（集成套件在无 daemon 时自动 skip）
        run: pytest tests/ -v
