name: memory-engine
version: 1.1.0
manifest_version: 1
kind: standalone
author: Hermes memory engine phase-3 cutover (2026-09-16)
description: 自建记忆引擎 provider（PG18+pgvector+PGroonga+Qwen3-Embedding，daemon :8766）。prefetch 每轮 recall 注入 + sync_turn 会话落库（hermes-sessions bank，每 20 轮批量）+ on_pre_compress 压缩前摘录/召回注入 + on_session_switch flush-on-switch，对齐 Hindsight provider 能力面。v1.1 增 auto outcome 推断上报（adopted/corrected，默认关，MEMORY_ENGINE_AUTO_OUTCOME 覆盖）。经 memory.provider 配置激活。
provides_hooks:
  - on_pre_compress
  - on_session_switch
  - on_session_end
