<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>memory-engine · 图谱视图</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- SRI 哈希=2026-09-17 实拉 jsDelivr 字节计算（sha384）；全局衔接已实测：graphology + Sigma（大写，window.sigma 不存在） -->
<script src="https://cdn.jsdelivr.net/npm/graphology@0.26.0/dist/graphology.umd.min.js"
        integrity="sha384-YdXPUVLFDJ3oITK7LFAPRyzkOcDK06bb7KRaE8GiQyGLsrvHaLS9Ej/lELMC7aCE" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/sigma@3.0.3/dist/sigma.min.js"
        integrity="sha384-2BM4IWUXdUSofkFc94Y1PY8U+cZYLJjB+EqQAoA2vfFGBvZK8aVaxEhICqCY4rlq" crossorigin="anonymous"></script>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --line:#262b36; --fg:#d7dce4; --dim:#8a93a5;
          --mem:#4da3ff; --ent:#f2b544; --accent:#39d98a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:14px/1.5 system-ui,"Segoe UI","PingFang SC","Noto Sans CJK SC",sans-serif; }
  header { display:flex; align-items:center; gap:12px; padding:10px 14px;
           border-bottom:1px solid var(--line); background:var(--panel); flex-wrap:wrap; }
  header h1 { font-size:15px; margin:0 8px 0 0; color:var(--fg); font-weight:600; }
  header label { color:var(--dim); font-size:12px; }
  select { background:var(--bg); color:var(--fg); border:1px solid var(--line);
           border-radius:6px; padding:4px 8px; max-width:180px; }
  #stats { margin-left:auto; color:var(--dim); font-size:12px; }
  #stats b { color:var(--accent); font-weight:600; }
  main { display:flex; height:calc(100vh - 49px); }
  #container { flex:1; position:relative; }
  #errbox { position:absolute; inset:0; display:none; place-items:center; color:var(--dim);
            text-align:center; padding:20px; white-space:pre-wrap; }
  aside { width:340px; border-left:1px solid var(--line); background:var(--panel);
          overflow-y:auto; padding:14px; }
  aside h2 { font-size:14px; margin:0 0 8px; color:var(--mem); word-break:break-all; }
  aside h2.entity { color:var(--ent); }
  .kv { margin:2px 0; font-size:12px; }
  .kv .k { color:var(--dim); margin-right:6px; }
  #nbody { white-space:pre-wrap; font-size:12.5px; color:var(--fg); background:var(--bg);
           border:1px solid var(--line); border-radius:8px; padding:10px; margin-top:10px;
           max-height:45vh; overflow-y:auto; }
  .neighbors { margin-top:12px; }
  .neighbors .n { color:var(--dim); font-size:12px; cursor:pointer; padding:2px 0;
                  border-bottom:1px dashed var(--line); }
  .neighbors .n:hover { color:var(--accent); }
  .tag { display:inline-block; background:var(--bg); border:1px solid var(--line);
         border-radius:10px; padding:0 8px; margin:2px 4px 2px 0; font-size:11px; color:var(--dim); }
  .legend { display:flex; gap:14px; color:var(--dim); font-size:12px; }
  .dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:4px; }
</style>
</head>
<body>
<header>
  <h1>memory-engine 图谱</h1>
  <label>bank <select id="f-bank"><option value="">全部</option></select></label>
  <label>domain <select id="f-domain"><option value="">全部</option></select></label>
  <span class="legend">
    <span><span class="dot" style="background:var(--mem)"></span>记忆</span>
    <span><span class="dot" style="background:var(--ent)"></span>实体</span>
  </span>
  <span id="stats">加载中…</span>
</header>
<main>
  <div id="container"><div id="errbox"></div></div>
  <aside id="side"><div style="color:var(--dim)">点击节点查看详情</div></aside>
</main>

<script type="module">
/* ———— CDN 衔接（实测结论）：graphology/sigma 走 UMD 全局（Sigma 大写）；
   FA2 布局无 UMD dist，走 jsDelivr +esm 动态 import，失败回退环形布局（不阻塞渲染）。 ———— */
const qs = new URLSearchParams(location.search);
const API = qs.get("api") || "";                 // ?api=http://127.0.0.1:8766 可跨源调试
const $ = (s) => document.querySelector(s);
const container = $("#container"), errbox = $("#errbox"), stats = $("#stats"), side = $("#side");
let renderer = null, graph = null, hovered = null;
// innerHTML 安全性：本页所有动态插值（API 返回的 title/body/标签/节点 label、节点 id）
// 一律先过 esc()（含引号转义）再入模板，等价于文本节点语义，无原始注入路径。

function showErr(msg) {
  errbox.style.display = "grid";
  errbox.textContent = msg;
}

async function fetchGraph(bank, domain) {
  const p = new URLSearchParams();
  if (bank) p.set("bank", bank);
  if (domain) p.set("domain", domain);
  const r = await fetch(`${API}/v1/graph?${p}`);
  if (!r.ok) throw new Error(`GET /v1/graph → ${r.status}（daemon 路由未注册或参数非法）`);
  return r.json();
}

function buildGraph(data) {
  graph = new graphology.Graph({ multi: false, type: "undirected" });
  for (const n of data.nodes)
    graph.addNode(n.id, { label: n.label, type: n.type, bank: n.bank, domain: n.domain,
                          size: n.type === "entity" ? 4 : 3, x: 0, y: 0 });
  for (const e of data.edges)
    if (graph.hasNode(e.source) && graph.hasNode(e.target))
      graph.addEdge(e.source, e.target, { relation: e.relation, weight: e.weight, size: 1 });
  // 环形初始坐标（零依赖），FA2 可用则优化布局
  const R = Math.max(1, graph.order / (2 * Math.PI));
  let i = 0;
  graph.forEachNode((id) => {
    const a = (2 * Math.PI * i++) / Math.max(1, graph.order);
    graph.setNodeAttribute(id, "x", R * Math.cos(a));
    graph.setNodeAttribute(id, "y", R * Math.sin(a));
  });
  return graph;
}

async function applyFA2(g) {
  try {
    const fa2 = await import("https://cdn.jsdelivr.net/npm/graphology-layout-forceatlas2@0.10.1/+esm");
    fa2.assign(g, { iterations: 120, settings: { gravity: 1, scalingRatio: 8,
      barnesHutOptimize: g.order > 2000, slowDown: 2 } });
  } catch (e) { console.warn("FA2 加载失败，保留环形布局:", e); }
}

function render() {
  if (renderer) renderer.kill();
  renderer = new Sigma(graph, container, {
    allowInvalidContainer: true,
    minCameraRatio: 0.02, maxCameraRatio: 20,
    defaultEdgeColor: "#2c3342",
    labelRenderedSizeThreshold: 9,
    nodeReducer: (id, attr) => {
      const a = { ...attr, color: attr.type === "entity" ? "#f2b544" : "#4da3ff" };
      if (hovered) {
        const hood = new Set([hovered]);
        graph.forEachNeighbor(hovered, (n) => hood.add(n));
        if (!hood.has(id)) { a.color = "#22262f"; a.label = null; a.size = Math.min(a.size, 2); }
      }
      return a;
    },
  });
  renderer.on("clickNode", ({ node }) => showDetail(node));
  renderer.on("clickStage", () => showDetail(null));
  renderer.on("enterNode", (n) => { hovered = n.node; renderer.refresh(); });
  renderer.on("leaveNode", () => { hovered = null; renderer.refresh(); });
}

async function showDetail(id) {
  current = id;
  if (!id) { side.innerHTML = '<div style="color:var(--dim)">点击节点查看详情</div>'; return; }
  const attr = graph.getNodeAttributes(id);
  const rels = [];
  graph.forEachNeighbor(id, (n) => rels.push(n));
  if (attr.type === "entity") {
    side.innerHTML = `<h2 class="entity">${esc(attr.label)}</h2>
      <div class="kv"><span class="k">类型</span>实体节点</div>
      <div class="kv"><span class="k">id</span>${esc(id)}</div>
      <div class="neighbors"><div class="kv k">关联记忆 ${rels.length}</div>${rels.slice(0, 60).map(
        (n) => `<div class="n" data-id="${esc(n)}">▸ ${esc(graph.getNodeAttribute(n, "label"))}</div>`).join("")}</div>`;
    wireNeighbors();
    return;
  }
  side.innerHTML = `<h2>${esc(attr.label)}</h2><div style="color:var(--dim)">加载中…</div>`;
  try {
    const r = await fetch(`${API}/v1/memories/${id}`);
    if (!r.ok) throw new Error(`GET /v1/memories/${id} → ${r.status}`);
    const m = await r.json();
    side.innerHTML = `
      <h2>${esc(m.title || "(无标题)")}</h2>
      <div class="kv"><span class="k">bank/domain</span>${esc(m.bank)} / ${esc(m.domain)}</div>
      <div class="kv"><span class="k">状态</span>${esc(m.ttl_state)} · ${esc(m.verify_status)} · P${esc(m.priority)}</div>
      <div class="kv"><span class="k">来源</span>${esc(m.source_type)} · tier=${esc(m.source_tier)}</div>
      <div class="kv"><span class="k">访问/采纳</span>${esc(m.access_count)} / ${esc(m.adopt_count)}</div>
      <div class="kv"><span class="k">更新于</span>${esc((m.updated_at || "").slice(0, 19).replace("T", " "))}</div>
      ${m.tags && m.tags.length ? `<div class="kv"><span class="k">tags</span>${m.tags.map((t) => `<span class="tag">${esc(t)}</span>`).join("")}</div>` : ""}
      <div id="nbody">${esc(m.body || m.body_ptr || "(空)")}</div>
      <div class="neighbors"><div class="kv k">邻接节点 ${rels.length}</div>${rels.slice(0, 60).map(
        (n) => `<div class="n" data-id="${esc(n)}">▸ ${esc(graph.getNodeAttribute(n, "label"))}</div>`).join("")}</div>`;
    wireNeighbors();
  } catch (e) {
    side.innerHTML = `<h2>${esc(attr.label)}</h2><div style="color:#ff7b72">${esc(String(e))}</div>`;
  }
}

function wireNeighbors() {
  side.querySelectorAll(".n").forEach((el) =>
    el.addEventListener("click", () => showDetail(el.dataset.id)));
}

const esc = (s) => String(s ?? "").replace(/[&<>"']/g,
  (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function fillSelect(sel, values) {
  const cur = sel.value;
  sel.innerHTML = '<option value="">全部</option>' +
    [...values].sort().map((v) => `<option value="${esc(v)}">${esc(v)}</option>`).join("");
  sel.value = cur;
}

async function load() {
  errbox.style.display = "none";
  stats.textContent = "加载中…";
  try {
    const bank = $("#f-bank").value, domain = $("#f-domain").value;
    const data = await fetchGraph(bank, domain);
    buildGraph(data);
    await applyFA2(graph);
    render();
    if (!$("#f-bank").dataset.seeded) {   // 下拉选项只在首次从全量数据播种（过滤重拉后不缩选项）
      fillSelect($("#f-bank"), new Set(data.nodes.filter((n) => n.bank).map((n) => n.bank)));
      fillSelect($("#f-domain"), new Set(data.nodes.filter((n) => n.domain).map((n) => n.domain)));
      $("#f-bank").dataset.seeded = "1";
    }
    stats.innerHTML = `节点 <b>${data.counts.nodes}</b> · 边 <b>${data.counts.edges}</b>` +
      (data.counts.truncated ? ` / 全量 ${data.counts.total_edges}（已达 limit 截断）` : "");
  } catch (e) {
    showErr(`图谱加载失败：${e}\n\n提示：本页需由 memory-engine daemon 或同源服务提供 /v1/graph；\n跨源调试可用 ?api=http://127.0.0.1:8766`);
  }
}

$("#f-bank").addEventListener("change", load);
$("#f-domain").addEventListener("change", load);
// 可验证性钩子（只读暴露）：E2E 驱动与人工排障用，不改任何行为
window.__graphView = { showDetail, getRenderer: () => renderer, getGraph: () => graph };
load();
</script>
</body>
</html>
