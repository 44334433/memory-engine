[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memory-engine-client"
version = "0.1.0"
description = "Typed Python client for memory-engine — a lifecycle-managed memory daemon for LLM agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "memory-engine maintainers" }]
keywords = ["llm", "agents", "memory", "pgvector", "client"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.24"]

[project.urls]
Homepage = "https://github.com/4433443433/memory-engine"
Repository = "https://github.com/4433443433/memory-engine"

[tool.setuptools.packages.find]
include = ["memoryengine*"]

[tool.setuptools.package-data]
memoryengine = ["py.typed"]
